[project]
name = "cc-model-router"
version = "0.1.0"
description = "Local router that lets Claude Code's /model mix Anthropic models with an OpenAI-compatible open-weight model"
readme = "README.md"
authors = [
    { name = "Martin Fracker, Jr.", email = "martin.frackerjr@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "litellm>=1.106.6",
    "mcp>=2.3.0",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
cc-model-router = "cc_model_router:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
